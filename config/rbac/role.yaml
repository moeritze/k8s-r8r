---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - secrets
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - cluster.x-k8s.io
  resources:
  - clusters
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - r8r.io
  resources:
  - replicationpolicies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - r8r.io
  resources:
  - replications
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - r8r.io
  resources:
  - replications/finalizers
  verbs:
  - update
- apiGroups:
  - r8r.io
  resources:
  - replications/status
  verbs:
  - get
  - patch
  - update
