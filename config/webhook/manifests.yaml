# Advisory validating webhook for replication requests (design D6).
#
# HAND-MAINTAINED: controller-gen's webhook marker cannot express
# matchConditions, so this file is not regenerated by `make manifests`. Keep it
# in sync with internal/webhook (Path constant, handled kinds).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
  annotations:
    # Optional cert-manager CA injection; requires ../certmanager to be
    # deployed. Remove this annotation if the caBundle is managed another way.
    cert-manager.io/inject-ca-from: CERTIFICATE_NAMESPACE/CERTIFICATE_NAME
webhooks:
  - name: vreplicationrequest.r8r.io
    admissionReviewVersions:
      - v1
    # sideEffects None: the handler only reads ReplicationPolicies and returns
    # a verdict; it never mutates state.
    sideEffects: None
    # failurePolicy Ignore is MANDATORY (admission-validation spec): this
    # webhook is advisory UX only. If it is unavailable, writes must proceed —
    # the controller re-evaluates ReplicationPolicy authoritatively on every
    # reconcile, so a bypassed webhook can never cause unauthorized
    # replication, only later feedback via Replication status and events.
    # Never set this to Fail: that would make operator downtime block all
    # annotated Secret/ConfigMap writes cluster-wide.
    failurePolicy: Ignore
    # Small timeout for the same reason: feedback is nice-to-have; user writes
    # must not wait on a slow webhook.
    timeoutSeconds: 2
    matchPolicy: Equivalent
    clientConfig:
      service:
        name: webhook-service
        namespace: system
        # Must match internal/webhook.Path.
        path: /validate-replication-request
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["secrets", "configmaps"]
        scope: Namespaced
    # Only objects that opted into k8s-r8r reach the webhook: ordinary
    # Secret/ConfigMap traffic never incurs an admission call
    # (admission-validation spec, "Webhook scope is limited to opted-in
    # objects"). On UPDATE `object` is the incoming state, so removing all
    # r8r.io annotations also bypasses the webhook — cleanup is always
    # admitted. matchConditions are GA since Kubernetes 1.30 (minimum
    # supported version, see design.md risks).
    matchConditions:
      - name: has-r8r-annotation
        expression: >-
          has(object.metadata.annotations) &&
          object.metadata.annotations.exists(k, k.startsWith('r8r.io/'))
