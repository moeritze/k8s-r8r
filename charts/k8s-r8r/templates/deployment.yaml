apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k8s-r8r.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-r8r.labels" . | nindent 4 }}
    control-plane: controller-manager
spec:
  # Leader election is always on: replicas > 1 run as hot standbys and
  # exactly one instance reconciles at a time.
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "k8s-r8r.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "k8s-r8r.selectorLabels" . | nindent 8 }}
        control-plane: controller-manager
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "k8s-r8r.serviceAccountName" . }}
      terminationGracePeriodSeconds: 10
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: manager
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
        - /manager
        args:
        - --leader-elect
        - --health-probe-bind-address=:8081
        {{- if .Values.metrics.enabled }}
        - --metrics-bind-address=:{{ .Values.metrics.port }}
        - --metrics-secure={{ .Values.metrics.secure }}
        {{- else }}
        - --metrics-bind-address=0
        {{- end }}
        - --discovery-provider={{ .Values.discoveryProvider }}
        {{- /* One flag per entry (range over a map is key-sorted, so the
               rendering is stable) — a single comma-joined value could not
               carry a value containing a comma. */}}
        {{- range $key, $value := .Values.discoverySettings }}
        - {{ printf "--discovery-setting=%s=%v" $key $value | quote }}
        {{- end }}
        - --hub-name={{ .Values.hubName }}
        - --allowed-kinds={{ join "," .Values.allowedKinds }}
        {{- with .Values.stripMetadataKeys }}
        - --strip-metadata-keys={{ join "," . }}
        {{- end }}
        {{- with .Values.spokeResync }}
        - --spoke-resync={{ . }}
        {{- end }}
        {{- if .Values.webhook.enabled }}
        - --webhook-cert-path=/tmp/k8s-webhook-server/serving-certs
        {{- end }}
        {{- range .Values.extraArgs }}
        - {{ . }}
        {{- end }}
        {{- if not .Values.webhook.enabled }}
        env:
        # Scaffold convention honored by cmd/main.go: skips webhook setup.
        - name: ENABLE_WEBHOOKS
          value: "false"
        {{- end }}
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        {{- if .Values.metrics.enabled }}
        - containerPort: {{ .Values.metrics.port }}
          name: metrics
          protocol: TCP
        {{- end }}
        {{- if .Values.webhook.enabled }}
        - containerPort: {{ .Values.webhook.port }}
          name: webhook
          protocol: TCP
        {{- end }}
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        {{- if .Values.webhook.enabled }}
        volumeMounts:
        - name: webhook-cert
          mountPath: /tmp/k8s-webhook-server/serving-certs
          readOnly: true
        {{- end }}
      {{- if .Values.webhook.enabled }}
      volumes:
      - name: webhook-cert
        secret:
          secretName: {{ include "k8s-r8r.webhookCertSecret" . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
