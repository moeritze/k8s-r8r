{{- if .Values.rbac.create }}
# Operator RBAC. The ClusterRole rules mirror config/rbac/role.yaml
# (generated by controller-gen from the +kubebuilder:rbac markers); keep
# them in sync when markers change.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "k8s-r8r.fullname" . }}-manager
  labels:
    {{- include "k8s-r8r.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - secrets
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
# The operator records events through the events.k8s.io/v1 API
# (manager.GetEventRecorder), so the new API group needs create/patch too;
# without it every event is silently dropped with a 403.
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - cluster.x-k8s.io
  resources:
  - clusters
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - r8r.io
  resources:
  - replicationpolicies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - r8r.io
  resources:
  - replications
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - r8r.io
  resources:
  - replications/finalizers
  verbs:
  - update
- apiGroups:
  - r8r.io
  resources:
  - replications/status
  verbs:
  - get
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "k8s-r8r.fullname" . }}-manager
  labels:
    {{- include "k8s-r8r.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "k8s-r8r.fullname" . }}-manager
subjects:
- kind: ServiceAccount
  name: {{ include "k8s-r8r.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
---
# Leader election (namespaced).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "k8s-r8r.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-r8r.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "k8s-r8r.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-r8r.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "k8s-r8r.fullname" . }}-leader-election
subjects:
- kind: ServiceAccount
  name: {{ include "k8s-r8r.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- if and .Values.metrics.enabled .Values.metrics.secure }}
---
# Metrics endpoint protection: the manager authenticates/authorizes
# scrapers via TokenReview/SubjectAccessReview.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "k8s-r8r.fullname" . }}-metrics-auth
  labels:
    {{- include "k8s-r8r.labels" . | nindent 4 }}
rules:
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- apiGroups:
  - authorization.k8s.io
  resources:
  - subjectaccessreviews
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "k8s-r8r.fullname" . }}-metrics-auth
  labels:
    {{- include "k8s-r8r.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "k8s-r8r.fullname" . }}-metrics-auth
subjects:
- kind: ServiceAccount
  name: {{ include "k8s-r8r.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
---
# Grantable role for metrics scrapers (bind it to your Prometheus SA).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "k8s-r8r.fullname" . }}-metrics-reader
  labels:
    {{- include "k8s-r8r.labels" . | nindent 4 }}
rules:
- nonResourceURLs:
  - "/metrics"
  verbs:
  - get
{{- end }}
{{- end }}
