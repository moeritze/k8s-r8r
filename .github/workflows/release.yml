name: Release

# Publishes release artifacts when a version tag (v*) is pushed:
#   - multi-arch operator image  -> ghcr.io/moeritze/k8s-r8r:<tag> (+ :latest for stable tags)
#     signed (cosign keyless) + SBOM + SLSA provenance attestations
#   - packaged Helm chart        -> oci://ghcr.io/moeritze/charts/k8s-r8r (cosign signed)
#   - GitHub release with generated notes (prerelease when the tag contains '-')
# Build/push/sign steps are shared with edge.yml via the composite actions in
# .github/actions/. Composite (not reusable workflows) so the cosign identity
# stays release.yml@refs/tags/v… (design D1 of publish-edge-channel-from-main).
# Consumer-side verification commands live in docs/releasing.md.

on:
  push:
    tags:
      - "v*"

permissions: {}

env:
  IMAGE_NAME: ghcr.io/moeritze/k8s-r8r
  CHART_REPO: ghcr.io/moeritze/charts

jobs:
  publish-image:
    name: Publish container image (ghcr)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push image + cosign signature + attestation referrers
      id-token: write # cosign keyless (Sigstore OIDC) + attestation signing
      attestations: write # actions/attest-build-provenance
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The :latest rule lives here, not in the shared action, so it is
      # expressed in exactly one place.
      - name: Compute image tags
        id: tags
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tags="${IMAGE_NAME}:${TAG}"
          # Stable semver only (no '-'): also move :latest.
          case "$TAG" in
            *-*) echo "prerelease tag — skipping :latest" ;;
            *)   tags="${tags},${IMAGE_NAME}:latest" ;;
          esac
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Publish image
        uses: ./.github/actions/publish-image
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.tags.outputs.tags }}
          version: ${{ github.ref_name }}

  publish-chart:
    name: Publish Helm chart (ghcr OCI)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push chart + cosign signature
      id-token: write # cosign keyless (Sigstore OIDC)
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Chart version tracks the tag (without v); appVersion is the full tag
      # so the chart's default image tag (.Chart.AppVersion) resolves to the
      # image published by this same run.
      - name: Compute chart version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Publish chart
        uses: ./.github/actions/publish-chart
        with:
          chart-repo: ${{ env.CHART_REPO }}
          chart-version: ${{ steps.version.outputs.version }}
          app-version: ${{ github.ref_name }}

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs:
      - publish-image
      - publish-chart
    permissions:
      contents: write
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create release with generated notes
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          args=(--generate-notes --verify-tag)
          # Tags containing '-' (e.g. v0.2.0-alpha.1) are prereleases.
          case "$TAG" in
            *-*) args+=(--prerelease) ;;
          esac
          gh release create "$TAG" "${args[@]}" \
            --title "$TAG" \
            --repo "$GITHUB_REPOSITORY"
