name: CI

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  dco:
    name: DCO
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on all PR commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          # Merge commits are exempt (GitHub's own update-branch merges carry no sign-off).
          for sha in $(git rev-list --no-merges "$BASE_SHA".."$HEAD_SHA"); do
            # Bot-authored commits (Dependabot) are exempt: the bot cannot add a
            # Signed-off-by trailer, and merging its PR is the maintainer's own
            # certification. Human commits are still required to sign off.
            case "$(git log -1 --format=%ae "$sha")" in
              *"[bot]@users.noreply.github.com") continue ;;
            esac
            if ! git log -1 --format=%B "$sha" | grep -qi '^Signed-off-by: .\+<.\+@.\+>'; then
              echo "::error::commit $sha lacks a Signed-off-by trailer (use 'git commit -s')"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] && echo "All commits signed off."
          exit "$missing"

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # full history — gitleaks scans every commit
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check linter configuration
        run: make lint-config

      - name: Run linter
        run: make lint

  test:
    name: Unit tests + envtest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests (unit + envtest)
        run: make test

  build:
    name: Build binary + image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build manager binary
        run: go build -o bin/manager cmd/main.go

      - name: Build docker image (no push)
        run: docker build -t k8s-r8r:ci .

  e2e:
    name: E2E (kind fleet, hub + 2 spokes)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - lint
      - test
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind "https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      # The suite provisions its own fleet (hub + 2 spokes), builds and
      # side-loads the operator image, installs the Helm chart, and simulates
      # ClusterAPI inventory; see test/e2e.
      - name: Run e2e tests
        run: make test-e2e

      - name: Tear down kind fleet
        if: always()
        run: hack/kind-fleet.sh down
