name: Vulnerability scan

# govulncheck reports only vulnerabilities that are actually *reachable* from
# this module's code paths, so a clean run is a meaningful statement.
#
# Kept out of ci.yml deliberately: the schedule trigger is the point (the Go
# vulnerability database moves even when the code does not), and a `schedule`
# entry on ci.yml would either fire every CI job weekly or need an `if:` guard
# on each of them. A separate workflow also gives this a stable, distinct check
# name for branch protection.

on:
  pull_request:
  schedule:
    # Mondays 06:17 UTC — after the Dependabot window, off the top of the hour.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Scans module dependencies *and* the standard library. Exits non-zero
      # when a reachable vulnerability is found — reachability is why a clean
      # run means something rather than being a CVE-count ritual.
      #
      # The toolchain deliberately tracks the Dockerfile's builder tag
      # (`FROM golang:1.26`, a floating patch tag) rather than go.mod's
      # `go 1.26.0` directive: go.mod states the module's *minimum* toolchain,
      # while the shipped binary always gets the newest 1.26.x. Scanning at the
      # minimum over-reports stdlib patch findings we do not actually ship.
      # Keep this minor version in sync with the Dockerfile.
      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: "1.26"
          repo-checkout: "false" # already checked out above
          go-package: ./...
