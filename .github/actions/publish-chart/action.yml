name: Publish Helm chart
description: >
  Package charts/k8s-r8r, push it to ghcr as an OCI artifact and cosign-sign it
  by digest. Shared by release.yml and edge.yml; a composite action so the
  signing identity stays the calling workflow (design D1).
  The caller must check out the repo first and grant contents: read,
  packages: write, id-token: write.

inputs:
  chart-version:
    description: Chart version to package (semver, no leading v).
    required: true
  app-version:
    description: Chart appVersion; the chart's default image tag, so it must equal the published image tag.
    required: true
  chart-repo:
    description: OCI repository the chart is pushed under.
    required: false
    default: ghcr.io/moeritze/charts
  token:
    description: Token for ghcr login.
    required: false
    default: ${{ github.token }}

outputs:
  digest:
    description: Digest of the pushed chart manifest.
    value: ${{ steps.chart.outputs.digest }}

runs:
  using: composite
  steps:
    # cosign reads ~/.docker/config.json; `helm registry login` only writes
    # helm's own registry config, so log in with docker too.
    - name: Log in to ghcr.io
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Package and push chart
      id: chart
      shell: bash
      env:
        VERSION: ${{ inputs.chart-version }}
        APP_VERSION: ${{ inputs.app-version }}
        CHART_REPO: ${{ inputs.chart-repo }}
        TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        echo "${TOKEN}" | helm registry login ghcr.io \
          --username "${GITHUB_ACTOR}" --password-stdin
        # appVersion is the chart's default image tag (.Chart.AppVersion), so
        # the chart installs the image published by this same run.
        helm package charts/k8s-r8r \
          --version "${VERSION}" \
          --app-version "${APP_VERSION}"
        # helm push reports the pushed manifest digest; capture it so the
        # signature is bound to an immutable digest rather than a tag.
        helm push "k8s-r8r-${VERSION}.tgz" "oci://${CHART_REPO}" 2>&1 | tee push.log
        # `|| true` so a no-match falls through to the explicit check below
        # rather than tripping set -e/pipefail with no explanation.
        digest="$(grep -oE 'sha256:[0-9a-f]{64}' push.log | head -n1 || true)"
        if [ -z "$digest" ]; then
          echo "::error::could not parse chart digest from helm push output"
          cat push.log
          exit 1
        fi
        echo "digest=${digest}" >> "$GITHUB_OUTPUT"

    - name: Sign chart (keyless, by digest)
      shell: bash
      env:
        CHART_REPO: ${{ inputs.chart-repo }}
        DIGEST: ${{ steps.chart.outputs.digest }}
      run: |
        set -euo pipefail
        cosign sign --yes "${CHART_REPO}/k8s-r8r@${DIGEST}"
