name: Publish operator image
description: >
  Build the multi-arch operator image, push it to ghcr, sign it (cosign keyless)
  and attach SBOM + SLSA provenance. Shared by release.yml and edge.yml.
  A composite action (not a reusable workflow) so the Sigstore certificate
  identity stays the *calling* workflow: release.yml@refs/tags/v… for releases,
  edge.yml@refs/heads/main for edge (design D1). Tag selection, including the
  :latest rule, stays with the caller.
  The caller must check out the repo first and grant contents: read,
  packages: write, id-token: write, attestations: write.

inputs:
  tags:
    description: Comma-separated full image refs to push (e.g. ghcr.io/moeritze/k8s-r8r:v0.1.0).
    required: true
  version:
    description: Value for org.opencontainers.image.version.
    required: true
  revision:
    description: Value for org.opencontainers.image.revision.
    required: false
    default: ${{ github.sha }}
  annotations-level:
    description: Where OCI annotations land; index,manifest puts them on the multi-arch index too.
    required: false
    default: index,manifest
  image:
    description: Image name without tag; signing and attestation subject.
    required: false
    default: ghcr.io/moeritze/k8s-r8r
  token:
    description: Token for ghcr login.
    required: false
    default: ${{ github.token }}

outputs:
  digest:
    description: Digest of the pushed multi-arch index.
    value: ${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    # No QEMU: the Dockerfile builder stage runs on $BUILDPLATFORM and
    # cross-compiles, the final stage has no RUN (design D4).
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Log in to ghcr.io
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    # Labels/annotations only — the pushed tags come from inputs.tags so tag
    # selection stays with the caller.
    # ANNOTATIONS_LEVELS=index,manifest is what makes the OCI annotations land
    # on the multi-arch image *index*, not just the per-arch child manifests.
    - name: Compute OCI labels and annotations
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      env:
        DOCKER_METADATA_ANNOTATIONS_LEVELS: ${{ inputs.annotations-level }}
      with:
        images: ${{ inputs.image }}
        flavor: latest=false
        # Only feeds org.opencontainers.image.version; not pushed.
        tags: type=raw,value=${{ inputs.version }}
        # Defaults already cover title/description/url/source/created/licenses
        # from the repo + ref. These pin the ones that would otherwise depend on
        # the repo's GitHub description field or the event.
        # labels and annotations take separate inputs — keep them in sync.
        labels: |
          org.opencontainers.image.description=Kubernetes operator for policy-gated cross-cluster replication of Secrets and ConfigMaps
          org.opencontainers.image.documentation=https://github.com/moeritze/k8s-r8r/blob/main/README.md
          org.opencontainers.image.revision=${{ inputs.revision }}
        annotations: |
          org.opencontainers.image.description=Kubernetes operator for policy-gated cross-cluster replication of Secrets and ConfigMaps
          org.opencontainers.image.documentation=https://github.com/moeritze/k8s-r8r/blob/main/README.md
          org.opencontainers.image.revision=${{ inputs.revision }}

    - name: Build and push (linux/amd64, linux/arm64)
      id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ inputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        annotations: ${{ steps.meta.outputs.annotations }}
        # BuildKit attestations, attached to the pushed index as OCI
        # attestation manifests (readable with `docker buildx imagetools inspect`).
        sbom: true
        provenance: mode=max
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    # Signs the multi-arch index digest. Verifying by tag works too: cosign
    # resolves the tag to this same digest.
    - name: Sign image (keyless, by digest)
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        set -euo pipefail
        cosign sign --yes "${IMAGE}@${DIGEST}"

    # Sigstore-signed SLSA provenance, recorded in the GitHub attestations API
    # and pushed to ghcr as an OCI referrer of the image digest.
    # Verifiable with `gh attestation verify` and `cosign verify-attestation`.
    - name: Attest build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-name: ${{ inputs.image }}
        subject-digest: ${{ steps.build.outputs.digest }}
        push-to-registry: true
